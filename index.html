<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Mi Progreso de Ahorro</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: url('cozy.gif') no-repeat center center fixed;
      background-size: cover;
      color: #4b2e2e;
      padding: 2rem;
      max-width: 600px;
      margin: auto;
      border: 2px solid #d8b98b;
      border-radius: 15px;
      box-shadow: 4px 4px 10px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #a0522d;
      margin-bottom: 1.5rem;
    }

    .subtitulo {
      text-align: center;
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 1rem;
      color: #7b4a27;
    }

    .input-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.3rem;
      font-weight: bold;
      color: #5a3921;
    }

    input {
      width: 100%;
      padding: 0.6rem;
      font-size: 1rem;
      border: 1px solid #d8b98b;
      border-radius: 8px;
      background-color: #fff8ef;
    }

    button {
      background-color: #d2691e;
      color: white;
      padding: 0.7rem 1.2rem;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      width: 100%;
      margin-top: 1rem;
    }

    button:hover {
      background-color: #b0521c;
    }

    .progress-bar {
      background-color: #f0e6d2;
      border-radius: 10px;
      overflow: hidden;
      margin-top: 1rem;
      border: 1px solid #c7a17a;
    }

    .progress-fill {
      height: 25px;
      background-color: #c77c36;
      width: 0%;
      text-align: center;
      color: white;
      line-height: 25px;
      transition: width 0.5s ease;
    }

    .result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
      text-align: center;
    }

    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.9rem;
      color: #7b5c3c;
    }

    .imagen-meta {
      display: block;
      margin: 1rem auto;
      max-width: 100%;
      border-radius: 10px;
    }

    .gif-meta {
      display: block;
      margin: 1rem auto;
      max-width: 100%;
    }

  </style>
</head>
<body>

  <h1>🌰 Mi Progreso de Ahorro</h1>

  <div class="input-group">
    <label for="titulo">¿Para qué estás ahorrando?</label>
    <input type="text" id="titulo" placeholder="Ej: Vacaciones, curso, algo especial...">
  </div>

  <div class="subtitulo" id="mostrarTitulo">✨ Tu objetivo aparecerá aquí ✨</div>

  <div class="input-group">
    <label for="meta">Meta de ahorro ($):</label>
    <input type="number" id="meta" placeholder="Ej: 100000">
  </div>

  <div class="input-group">
    <label for="ahorrado">Dinero ahorrado ($):</label>
    <input type="number" id="ahorrado" placeholder="Ej: 25000">
  </div>

  <button onclick="actualizarProgreso()">Actualizar</button>

  <div class="progress-bar">
    <div class="progress-fill" id="barra">0%</div>
  </div>

  <div class="result" id="resultado"></div>

  <!-- Imagen motivacional o gif de la meta -->
  <img class="imagen-meta" id="imagenMeta" src="" alt="Imagen de la meta">
  <img class="gif-meta" id="gifMeta" src="" alt="Gif motivacional" style="display:none;">

  <div class="footer">🍂 Estilo otoñal 2000s | Tu ahorro, tu ritmo 🍁</div>

  <script>
    window.onload = function () {
      const meta = localStorage.getItem("meta");
      const ahorrado = localStorage.getItem("ahorrado");
      const titulo = localStorage.getItem("titulo");

      if (meta) document.getElementById("meta").value = meta;
      if (ahorrado) document.getElementById("ahorrado").value = ahorrado;
      if (titulo) {
        document.getElementById("titulo").value = titulo;
        document.getElementById("mostrarTitulo").textContent = titulo;
      }

      actualizarProgreso();
    };

    function actualizarProgreso() {
      const meta = parseFloat(document.getElementById("meta").value);
      const ahorrado = parseFloat(document.getElementById("ahorrado").value);
      const titulo = document.getElementById("titulo").value.trim();

      if (isNaN(meta) || isNaN(ahorrado) || meta <= 0) {
        alert("Por favor, ingresá valores válidos.");
        return;
      }

      const porcentaje = Math.min((ahorrado / meta) * 100, 100);
      const restante = Math.max(meta - ahorrado, 0);

      localStorage.setItem("meta", meta);
      localStorage.setItem("ahorrado", ahorrado);
      localStorage.setItem("titulo", titulo);

      document.getElementById("barra").style.width = porcentaje + "%";
      document.getElementById("barra").textContent = Math.floor(porcentaje) + "%";

      document.getElementById("resultado").innerHTML = `
        <p>Has ahorrado: <strong>$${ahorrado}</strong></p>
        <p>Te falta: <strong>$${restante}</strong></p>
      `;

      document.getElementById("mostrarTitulo").textContent = titulo || "✨ Tu objetivo aparecerá aquí ✨";

      // Cambiar la imagen o gif basado en el título de la meta
      if (titulo.includes("vacaciones")) {
        document.getElementById("imagenMeta").src = "https://www.example.com/vacaciones.jpg";
        document.getElementById("gifMeta").src = "https://www.example.com/vacaciones.gif";
        document.getElementById("gifMeta").style.display = "block";
      } else {
        document.getElementById("imagenMeta").src = "";
        document.getElementById("gifMeta").style.display = "none";
      }
    }
  </script>

</body>
</html>
